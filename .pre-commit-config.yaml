ci:
  # pre-commit.ci does not have Rust installed; cargo fmt and clippy are
  # covered by the GitHub Actions CI pipeline instead.
  skip: [fmt, clippy]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: cargo fmt
      - id: clippy
        name: cargo clippy
        args: ['--all-targets', '--all-features', '--', '-D', 'warnings']
