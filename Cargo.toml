[package]
name = "zoio"
version = "0.3.0"
edition = "2021"
authors = ["Marcelo Duarte Trevisani"]
description = "Cross-platform process resource monitor with real-time plots and CSV export"
license = "MIT"
repository = "https://github.com/marcelotrevisani/zoio"
readme = "README.md"
keywords = ["monitoring", "process", "cpu", "memory", "cross-platform"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
sysinfo = "0.32"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui_plot = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
regex = "1.11"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3.14"
proptest = "1.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "zoio"
path = "src/main.rs"

[lib]
name = "zoio"
path = "src/lib.rs"

[package.metadata.deb]
maintainer = "Marcelo Duarte Trevisani"
copyright = "2026, Marcelo Duarte Trevisani"
license-file = ["LICENSE", "0"]
extended-description = """\
zoio is a cross-platform process resource monitor. \
Select processes via checkboxes or regex patterns, then watch their \
CPU, memory, disk I/O, and network I/O in real time with four live plots. \
Export captured sessions to CSV."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/zoio", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/zoio/", "644"],
]

[package.metadata.wix]
upgrade-guid = "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"
path-guid = "B2C3D4E5-F6A7-8901-BCDE-F12345678901"
license = false
eula = false
