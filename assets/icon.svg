<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc66"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pulseGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="246" fill="url(#bg)" stroke="#0099cc" stroke-width="4" opacity="0.95"/>

  <!-- Eye shape - outer -->
  <path d="M76 256 C76 256 166 150 256 150 C346 150 436 256 436 256 C436 256 346 362 256 362 C166 362 76 256 76 256 Z"
        fill="none" stroke="url(#eyeGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)" opacity="0.9"/>

  <!-- Iris circle -->
  <circle cx="256" cy="256" r="68" fill="none" stroke="url(#eyeGrad)" stroke-width="8" opacity="0.7"/>

  <!-- Pupil -->
  <circle cx="256" cy="256" r="28" fill="#00d4ff" opacity="0.5"/>
  <circle cx="256" cy="256" r="14" fill="#00d4ff" opacity="0.8"/>

  <!-- Pulse/chart line through the eye (the key element - monitoring) -->
  <polyline points="96,256 170,256 200,210 225,290 250,220 270,280 295,240 310,256 340,256 360,220 380,260 420,256"
            fill="none" stroke="url(#pulseGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
            filter="url(#pulseGlow)"/>

  <!-- Small highlight reflection on the eye -->
  <circle cx="230" cy="232" r="8" fill="white" opacity="0.3"/>
</svg>
